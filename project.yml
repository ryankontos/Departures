name: Departures
options:
  bundleIdPrefix: com.ryankontos
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 5AMFX8X5ZN
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Departures:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryankontos.Departures
    sources:
      - apps/ios/DeparturesApp
      - apps/ios/Shared
    dependencies:
      - target: DeparturesLiveActivityExtension
      - target: DeparturesWatchApp
    info:
      path: apps/ios/DeparturesApp/Info.plist
      properties:
        CFBundleDisplayName: Departures
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: apps/ios/DeparturesApp/Departures.entitlements
      properties:
        aps-environment: development
  DeparturesLiveActivityExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryankontos.Departures.LiveActivityExtension
    sources:
      - apps/ios/LiveActivityExtension
      - apps/ios/Shared
    info:
      path: apps/ios/LiveActivityExtension/Info.plist
      properties:
        CFBundleDisplayName: Departures
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true
    entitlements:
      path: apps/ios/LiveActivityExtension/DeparturesLiveActivityExtension.entitlements
  DeparturesWatchApp:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryankontos.Departures.watchkitapp
    sources:
      - apps/watch/DeparturesWatchApp
      - apps/ios/Shared/ScheduleModels.swift
    info:
      path: apps/watch/DeparturesWatchApp/Info.plist
      properties:
        CFBundleDisplayName: Departures
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.ryankontos.Departures
schemes:
  Departures:
    build:
      targets:
        Departures: all
        DeparturesLiveActivityExtension: all
        DeparturesWatchApp: all
    run:
      config: Debug
